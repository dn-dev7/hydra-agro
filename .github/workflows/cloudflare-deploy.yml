name: Hydra Agro • Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.env.example'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: hydra-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site no Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar ambiente
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_NIVO_API: ${{ secrets.VITE_NIVO_AGRO_API }}
        run: |
          cp .env.example .env.production
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            printf '\nVITE_SUPABASE_URL=%s\n' "$SECRET_SUPABASE_URL" >> .env.production
          fi
          if [ -n "$SECRET_SUPABASE_KEY" ]; then
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SECRET_SUPABASE_KEY" >> .env.production
          fi
          if [ -n "$SECRET_NIVO_API" ]; then
            printf 'VITE_NIVO_AGRO_API=%s\n' "$SECRET_NIVO_API" >> .env.production
          fi
          npm run env:check

      - name: Verificar projeto
        run: npm run lint && npm test

      - name: Compilar site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Validar credencial Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN não configurado"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID não configurado"; exit 1; }

      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
