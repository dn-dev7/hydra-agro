name: Hydra Agro • Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'

permissions:
  contents: read

concurrency:
  group: hydra-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar e gerar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar configuração do backend
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ] && [ -n "$SECRET_SUPABASE_KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
              "$SECRET_SUPABASE_URL" "$SECRET_SUPABASE_KEY" > .env.production
          else
            cp .env.example .env.production
          fi
          npm run env:check

      - name: Verificar TypeScript
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Compilar aplicação web
        run: npm run build

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar artefato
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          mkdir -p mobile-output
          cp "$APK" "mobile-output/HydraAgro-CI-${GITHUB_RUN_NUMBER}.apk"

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: HydraAgro-CI-${{ github.run_number }}
          path: mobile-output/HydraAgro-CI-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7
