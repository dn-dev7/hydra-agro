name: Hydra Agro • Code Auth Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hydra-code-auth-backend.yml'
      - 'supabase/functions/hydra-code-auth/**'

permissions:
  contents: read

concurrency:
  group: hydra-code-auth-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar login por código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gfwypccosftpchpbdiir

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar credencial de deploy
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Adicione o secret SUPABASE_ACCESS_TOKEN no repositório para publicar a Edge Function."
            exit 1
          fi

      - name: Publicar hydra-code-auth
        shell: bash
        run: |
          npx --yes supabase@latest functions deploy hydra-code-auth \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
