name: Hydra Agro • Bootstrap Release 1.3.0

on:
  push:
    branches:
      - release/bootstrap-1.3.0
    paths:
      - '.github/workflows/bootstrap-release-1-3-0.yml'

permissions:
  contents: write

concurrency:
  group: hydra-bootstrap-release-1-3-0
  cancel-in-progress: false

jobs:
  release:
    name: Gerar e publicar APK oficial 1.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar configuração do backend
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ] && [ -n "$SECRET_SUPABASE_KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
              "$SECRET_SUPABASE_URL" "$SECRET_SUPABASE_KEY" > .env.production
          else
            cp .env.example .env.production
          fi
          npm run env:check

      - name: Verificar projeto
        run: |
          npm run lint
          npm test
          npm run build

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Validar secrets de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for VALUE in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$VALUE" ]; then
              echo "Os secrets de assinatura Android ainda não estão configurados."
              exit 1
            fi
          done

      - name: Restaurar keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hydra-agro-release.jks"
          test -s "$RUNNER_TEMP/hydra-agro-release.jks"

      - name: Gerar APK oficial assinado
        working-directory: android
        env:
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PHYDRA_VERSION_NAME='1.3.0' \
            -PHYDRA_VERSION_CODE='1003000' \
            -PHYDRA_KEYSTORE_FILE="$RUNNER_TEMP/hydra-agro-release.jks" \
            -PHYDRA_KEYSTORE_PASSWORD="$HYDRA_KEYSTORE_PASSWORD" \
            -PHYDRA_KEY_ALIAS="$HYDRA_KEY_ALIAS" \
            -PHYDRA_KEY_PASSWORD="$HYDRA_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          mkdir -p release-output
          cp "$APK" 'release-output/HydraAgro-v1.3.0.apk'
          cd release-output
          sha256sum 'HydraAgro-v1.3.0.apk' > 'HydraAgro-v1.3.0.apk.sha256'

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Hydra Agro v1.3.0
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: |
            release-output/HydraAgro-v1.3.0.apk
            release-output/HydraAgro-v1.3.0.apk.sha256
